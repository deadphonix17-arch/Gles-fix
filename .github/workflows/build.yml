name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd src && zip -r ../stencilfix-1.0.0.jar .
      - uses: actions/upload-artifact@v4
        with:
          name: stencilfix
          path: stencilfix-1.0.0.jar
